name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: |
          unzip -o CollegeSchedule_fresh_project.zip -d project

      - name: Build APK
        run: |
          gradle -p project/CollegeSchedule assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: college-schedule-apk
          path: project/CollegeSchedule/app/build/outputs/apk/debug/*.apk
